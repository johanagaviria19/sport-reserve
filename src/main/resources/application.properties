# ============================================================
# SportReserve - Configuracion General
# ============================================================
spring.application.name=sport-reserve
server.port=8081

# ============================================================
# DATASOURCE - H2 (PERFIL POR DEFECTO - DESARROLLO)
# Base de datos en memoria para desarrollo y pruebas.
# Se elimina al apagar la aplicacion (salvo DB_CLOSE_DELAY=-1).
# ============================================================
spring.datasource.url=jdbc:h2:mem:sportreserve;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# CONSOLA H2 (SOLO PARA DESARROLLO)
# Acceder con el navegador: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:sportreserve
# User: sa   Password: (vacio)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# JPA / HIBERNATE
# ddl-auto: update -> Crea/actualiza tablas al arrancar sin borrar datos.
# show-sql + format_sql: Muestra consultas SQL formateadas en consola.
# open-in-view=false: Desactiva Open Session in View (buena practica).
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# LOGGING
# ============================================================
logging.level.com.sportreserve=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# VALIDACION
# Fallo al arrancar si hay valores de propiedades no resueltos.
# ============================================================
spring.config.import-check.enabled=true

# ============================================================
